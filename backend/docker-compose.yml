services:
  postgres:
    image: postgres:16-alpine
    container_name: livora-postgres
    environment:
      POSTGRES_USER: livora
      POSTGRES_PASSWORD: livora_dev_password
      POSTGRES_DB: livora_dev
    ports:
      - "5432:5432"
    volumes:
      - livora_pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    container_name: livora-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  livora_pgdata:
