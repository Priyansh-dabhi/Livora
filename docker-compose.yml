services:
  postgres:
    image: postgres:16-alpine
    container_name: livora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: livora
      POSTGRES_PASSWORD: livora_dev_password
      POSTGRES_DB: livora_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: livora-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP server
      - "8025:8025"   # Web UI (http://localhost:8025)
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres_data:
